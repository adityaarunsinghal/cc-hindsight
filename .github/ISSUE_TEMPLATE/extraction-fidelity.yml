name: Extraction fidelity report
description: The exporter dropped genuine human input, or admitted machine text. The most valuable report we get.
labels: ["extraction-fidelity"]
body:
  - type: markdown
    attributes:
      value: |
        Extraction is a fidelity contract (rules R1–R11). If `export` dropped
        something you actually typed — or let machine-injected text through —
        we want a fixture-grade report. Run with `--verbose` first: every
        dropped piece is logged with the rule that dropped it.
  - type: input
    id: version
    attributes:
      label: cc-hindsight version + Claude Code version
      placeholder: cc-hindsight 0.1.1 / claude 2.1.207
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Which direction is the failure?
      options:
        - Human input was dropped (missing from export)
        - Machine text was admitted (should have been dropped)
        - Something else (dedupe, ordering, markers)
    validations:
      required: true
  - type: textarea
    id: verbose-log
    attributes:
      label: Relevant `export --verbose` lines
      description: The drop log lines for the affected session (scrub anything sensitive).
  - type: textarea
    id: fixture
    attributes:
      label: Synthetic fixture reproducing the shape
      description: |
        The JSONL entry (or minimal sequence) with every real string replaced by
        a placeholder — keep the *structure* (field names, nesting, types)
        exactly as your transcript has it. This is what lets us pin the shape
        in a regression test. See CONTRIBUTING.md → "Adding a fixture".
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the export contain?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm the fixture above is synthetic — no real prompts, paths, names, or keys.
          required: true
